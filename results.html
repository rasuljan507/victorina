<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты Викторины</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background-color: #f4f4f4; }
        h1 { text-align: center; color: #333; }
        /* ! НОВЫЙ БЛОК ДЛЯ КНОПКИ И ЗАГРУЗКИ */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 10px auto;
        }
        #loading { text-align: left; font-size: 1.2em; margin: 0; }
        .danger-btn {
            background-color: #D9534F; /* Красный */
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .danger-btn:hover {
            background-color: #C9302C;
        }
        /* ! КОНЕЦ НОВОГО БЛОКА */
        table { width: 100%; max-width: 1200px; /* ! Увеличил ширину */ margin: 20px auto; border-collapse: collapse; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px 15px; text-align: left; }
        th { background-color: #004A99; color: white; cursor: pointer; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        /* ! Стиль для мобильных - разрешаем горизонтальный скролл */
        @media (max-width: 768px) {
            table { display: block; overflow-x: auto; white-space: nowrap; }
        }
    </style>
</head>
<body>

    <h1>Результаты викторины "Знатоки Хакасии"</h1>
    <!-- ! ИЗМЕНЕННЫЙ БЛОК -->
    <div class="controls">
        <p id="loading">Загрузка результатов...</p>
        <button id="clear-data-btn" class="danger-btn">Очистить все данные</button>
    </div>
    
    <table id="results-table">
        <thead>
            <tr>
                <th data-sort="name">Имя</th>
                <th data-sort="age">Возраст</th>
                <!-- ! НОВЫЕ КОЛОНКИ -->
                <th>Телефон</th>
                <th>Адрес</th>
                <!-- ! КОНЕЦ НОВЫХ КОЛОНОК -->
                <th data-sort="score">Счет (из 30)</th>
                <th data-sort="time">Время (мм:сс)</th>
                <th data-sort="timestamp">Дата</th>
            </tr>
        </thead>
        <tbody id="results-body">
            <!-- Строки будут добавлены с помощью JavaScript -->
        </tbody>
    </table>

    <!-- 
      ! ВАЖНО: Подключаем Firebase SDK (Модульная v9+)
    -->
    <script type="module" src="results.js"></script>

</body>
</html>
